<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparaison de prompts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    header { background: #161b22; padding: 1rem 1.5rem; border-bottom: 2px solid #58a6ff; position: sticky; top: 0; z-index: 20; }
    header h1 { font-size: 1.35rem; margin-bottom: 0.35rem; }
    header p { color: #8b949e; font-size: 0.9rem; }
    #stats { margin-top: 0.5rem; font-weight: 600; color: #58a6ff; }
    #load-error { display: none; margin: 1rem 1.5rem; padding: 1rem; background: #3d1f1f;
      border: 1px solid #da3633; border-radius: 8px; color: #ffa198; line-height: 1.5; }
    .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem;
                 padding: 1rem 1.5rem; background: #161b22; border-bottom: 1px solid #30363d; }
    .filters label { display: block; font-size: 0.75rem; color: #8b949e; margin-bottom: 0.25rem; }
    .filters select, .filters input[type="text"] { width: 100%; padding: 0.4rem; border-radius: 6px;
      border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.85rem; }
    .filters select[multiple] { min-height: 88px; }
    .check-row { display: flex; align-items: center; gap: 0.45rem; padding-top: 1.15rem; font-size: 0.85rem; color: #e6edf3; }
    .check-row input { accent-color: #58a6ff; }
    .filter-actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .btn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 0.45rem 0.9rem;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #238636; color: #fff; border-color: #238636; }
    #load-more { display: none; margin: 1rem auto; }
    #grid { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; max-width: 2400px; margin: 0 auto; }
    .card { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 0;
      background: #161b22; border-radius: 10px; overflow: hidden;
      border: 2px solid #30363d; cursor: zoom-in; }
    .card.agree { border-color: #238636; }
    .card.disagree { border-color: #d29922; }
    .card:hover { border-color: #58a6ff; }
    .card img { width: 100%; height: 100%; min-height: 200px; max-height: 280px; object-fit: contain; background: #000; }
    .meta { padding: 0.75rem 0.9rem; font-size: 0.82rem; line-height: 1.45; min-width: 0; }
    .meta-top { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.55rem; }
    .preds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem; }
    .pred { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 0.55rem 0.65rem; min-width: 0; }
    .pred.correct { border-color: #238636; }
    .pred.incorrect { border-color: #da3633; }
    .pred.missing { opacity: 0.55; }
    .pred-key { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.25rem; }
    .pred-label { font-weight: 600; }
    .reason-preview { color: #8b949e; margin-top: 0.35rem; font-size: 0.75rem;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tag { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.72rem;
      font-weight: 600; margin-right: 0.2rem; }
    .tag-gt { background: #00ff88; color: #0d1117; }
    .tag-agree { background: #238636; color: #fff; }
    .tag-disagree { background: #9e6a03; color: #fff; }
    .score { color: #f5a623; font-weight: 700; }
    .fname { color: #8b949e; font-size: 0.7rem; margin-top: 0.45rem; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; overflow: auto; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 96vw; max-height: 52vh; object-fit: contain; border: 3px solid #58a6ff; border-radius: 8px; }
    #lightbox .close { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; color: #fff;
      cursor: pointer; background: none; border: none; }
    #lb-meta { margin-top: 1rem; max-width: 1100px; width: 100%; text-align: left; font-size: 0.9rem; }
    .lb-preds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    .reason { color: #8b949e; margin-top: 0.5rem; line-height: 1.5; max-height: 180px; overflow-y: auto; white-space: pre-wrap; }
    .header-nav { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .header-nav a { color: #58a6ff; font-size: 0.9rem; }
    #prompt-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .prompt-chip { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 0.3rem 0.65rem;
      border-radius: 6px; cursor: pointer; font-size: 0.78rem; }
    .prompt-chip:hover { border-color: #58a6ff; color: #58a6ff; }
    .prompt-link { cursor: pointer; text-decoration: underline; text-decoration-color: #484f58; }
    .prompt-link:hover { color: #58a6ff; }
    #prompt-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 110;
      flex-direction: column; padding: 1.5rem; overflow: auto; }
    #prompt-modal.open { display: flex; }
    #prompt-modal .close { position: fixed; top: 1rem; right: 1.5rem; font-size: 2rem; color: #fff;
      cursor: pointer; background: none; border: none; z-index: 111; }
    #prompt-modal-inner { max-width: 900px; margin: 0 auto; width: 100%; }
    #prompt-modal-inner h2 { font-size: 1.1rem; margin-bottom: 0.35rem; }
    #prompt-modal-inner .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 0.75rem; }
    #prompt-modal-inner pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 1rem; white-space: pre-wrap; word-break: break-word; font-size: 0.82rem;
      line-height: 1.45; max-height: 75vh; overflow: auto; }
    #prompt-modal-inner .full-link { margin-top: 0.75rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Comparaison de prompts</h1>
    <p id="prompt-summary">Chargement des prompts…</p>
    <p style="margin-top:0.35rem;font-size:0.8rem;color:#8b949e">GT: images_projected_fov_h_90_corrected_20260821_133354.csv</p>
    <div class="header-nav">
      <a href="prompts.html">Voir les prompts (texte complet)</a>
      <span style="color:#8b949e">·</span>
      <span style="color:#8b949e;font-size:0.85rem">Clic sur un nom de prompt ci-dessous pour l’aperçu</span>
    </div>
    <div id="prompt-chips"></div>
    <div id="stats">Chargement…</div>
  </header>
  <div id="load-error"></div>

  <div class="filters">
    <div class="check-row">
      <input type="checkbox" id="f-disagree" checked>
      <label for="f-disagree" style="margin:0">Désaccords seulement</label>
    </div>
    <div><label for="f-prompts">Prompts affichés (multi)</label>
      <select id="f-prompts" multiple title="Ctrl+clic pour multi-sélection"></select></div>
    <div><label for="f-gt">Vérité terrain (multi)</label><select id="f-gt" multiple></select></div>
    <div><label for="f-pred">Prédiction (multi)</label><select id="f-pred" multiple></select></div>
    <div><label for="f-vs-gt">Vs vérité terrain</label>
      <select id="f-vs-gt">
        <option value="all">Tous</option>
        <option value="any-correct">Au moins un correct</option>
        <option value="any-wrong">Au moins un incorrect</option>
        <option value="all-correct">Tous corrects</option>
        <option value="all-wrong">Tous incorrects</option>
      </select></div>
    <div><label for="f-sort">Tri</label>
      <select id="f-sort">
        <option value="disagree">Désaccords d'abord</option>
        <option value="name">Nom fichier</option>
        <option value="gt">Vérité terrain</option>
        <option value="conf-gap">Écart de confiance ↓</option>
      </select></div>
    <div><label for="f-search">Recherche nom</label><input type="text" id="f-search" placeholder="id image…"></div>
    <div class="filter-actions">
      <button class="btn" id="btn-prompts-all" type="button">Tous les prompts</button>
      <button class="btn" id="btn-prompts-none" type="button">Aucun prompt</button>
      <button class="btn btn-primary" id="btn-apply">Appliquer filtres</button>
      <button class="btn" id="btn-reset">Réinitialiser</button>
      <label style="font-size:0.85rem;color:#8b949e"><input type="checkbox" id="f-live" checked> Filtre en direct</label>
    </div>
  </div>

  <div id="grid"></div>
  <button class="btn btn-primary" id="load-more">Afficher plus</button>

  <div id="lightbox">
    <button class="close">×</button>
    <img id="lb-img" src="" alt="">
    <div id="lb-meta"></div>
  </div>
  <div id="prompt-modal">
    <button class="close" id="prompt-modal-close">×</button>
    <div id="prompt-modal-inner"></div>
  </div>
  <script src="data.js"></script>
  <script src="texts.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
